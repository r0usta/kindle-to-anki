[tool.poetry]
package-mode = false

[project]
name = "kindle-to-anki"
requires-python = ">=3.12,<4"
dependencies = [
    "deepl (>=1.27.0,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "genanki (>=0.13.1,<0.14.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
